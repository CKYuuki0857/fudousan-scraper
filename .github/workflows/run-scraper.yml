name: 抓實價登錄

# ⚠️ 注意：5168 會封鎖 GitHub 機房 IP（HTTP 403），此 workflow 對 5168 多半會失敗。
#    主力流程請用「電腦跑 scraper-V6.py → 自動上傳 records.json → 手機用戰情室雲端載入」。
#    這支保留給：① 測試 ② 未來若改用不擋機房 IP 的來源 ③ 內政部 CSV 批次。

on:
  workflow_dispatch:
    inputs:
      name:
        description: '社區名（例：惟美）。填了就用社區名搜尋'
        required: false
        default: ''
      city:
        description: '縣市（例：台中市）'
        required: false
        default: '台中市'
      dist:
        description: '行政區（可空白，例：西屯區）'
        required: false
        default: ''
      pick:
        description: '要抓候選清單第幾個？1=第一個；0=只列清單不抓'
        required: false
        default: '1'
      url:
        description: '（進階）直接給 5168 社區網址，填了就忽略上面的社區名'
        required: false
        default: ''

permissions:
  contents: write        # 一定要，否則結果推不回倉庫

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests beautifulsoup4

      # --no-upload：雲端不必走 GitHub API 上傳，下一步的 git push 就會把檔案推回來
      - name: 執行抓取
        env:
          NAME: ${{ inputs.name }}
          CITY: ${{ inputs.city }}
          DIST: ${{ inputs.dist }}
          PICK: ${{ inputs.pick }}
          URL:  ${{ inputs.url }}
        run: python scraper-V6.py --no-upload

      - name: 把結果推回倉庫
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          for f in records.json candidates.json; do
            [ -f "$f" ] && git add "$f"
          done
          for f in records_*.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "沒有新資料（可能被 403 擋掉，或這次沒抓到東西），不用 commit"
          else
            git commit -m "抓取結果 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
